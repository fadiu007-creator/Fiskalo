name: CI
on:
  push:
    branches: [main, feature/atk-offline-local-first]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply all Supabase migrations and SQL contracts to disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash scripts/test-supabase-migrations.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/fiskalo-basic-workers/index.ts supabase/functions/fiskalo-basic-workers/handler.ts supabase/functions/fiskalo-basic-atk-receipts/index.ts supabase/functions/fiskalo-basic-atk-receipts/handler.ts
      - run: deno test --check supabase/functions/fiskalo-basic-workers/handler_test.ts supabase/functions/fiskalo-basic-atk-receipts/handler_test.ts
      - run: deno test supabase/functions/fiskalo-basic-workers/handler_test.ts supabase/functions/fiskalo-basic-atk-receipts/handler_test.ts
      - run: deno lint supabase/functions/fiskalo-basic-workers supabase/functions/fiskalo-basic-atk-receipts
      - run: npm run typecheck
      - run: npm run test:products
      - run: npm run test:offline
      - run: npm run test:payments
      - run: npm run test:full-atk
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test pos-agent/Fiskalo.PosAgent.Tests/Fiskalo.PosAgent.Tests.csproj --configuration Release
      - run: dotnet build pos-agent/Fiskalo.PosAgent.Host/Fiskalo.PosAgent.Host.csproj --configuration Release
      - run: npm run cf-build
