name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # Non-production build-only values allow static analysis/prerendering.
    # Real project credentials are injected only by the Cloudflare deployment environment.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fiskalo-ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpc2thbG8tY2ktcGxhY2Vob2xkZXIiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTYwMDAwMDAwMCwiZXhwIjoyMDAwMDAwMDAwfQ.c2FmZS1ub24tcHJvZC1jaS1rZXk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/fiskalo-basic-workers/index.ts
      - run: deno test --check supabase/functions/fiskalo-basic-workers/handler_test.ts
      - run: deno lint supabase/functions/fiskalo-basic-workers
      - run: npm run typecheck
      - run: npm run test:products
      - run: npm run test:payments
      - run: npm run test:pos-outage
      - run: npm run test:atk-browser
      - run: npm run test:atk-recovery
      - run: npm run test:atk-certificates
      - run: npm run test:atk-coupon-validation
      - run: npm run lint
      - run: npm run build
      - run: npm run cf-build
      - run: npm run cf-build:atk-recovery
