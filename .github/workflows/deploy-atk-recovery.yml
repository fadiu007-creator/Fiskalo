name: Deploy Fiskalo Cloudflare Workers

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiskalo-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Guard manual deployment target
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || (echo "Deployments are restricted to main." && exit 1)

      - name: Refuse stale automatic deployment
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main_sha" || (echo "Could not resolve current main SHA" && exit 1)
          if [ "$current_main_sha" != "$EXPECTED_SHA" ]; then
            echo "Refusing to deploy stale commit $EXPECTED_SHA; current main is $current_main_sha."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure server-only Supabase secret on both Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ATK_HEARTBEAT_PRIVATE_KEY_PEM: ${{ secrets.ATK_HEARTBEAT_PRIVATE_KEY_PEM }}
          FISKALO_ALLOWED_ORIGINS: ${{ secrets.FISKALO_ALLOWED_ORIGINS }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub secret CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing GitHub secret SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || (echo "Missing GitHub secret NEXT_PUBLIC_SUPABASE_ANON_KEY" && exit 1)
          test -n "$ATK_HEARTBEAT_PRIVATE_KEY_PEM" || (echo "Missing GitHub secret ATK_HEARTBEAT_PRIVATE_KEY_PEM" && exit 1)
          test -n "$FISKALO_ALLOWED_ORIGINS" || (echo "Missing GitHub secret FISKALO_ALLOWED_ORIGINS with exact app origin(s)" && exit 1)
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name fiskalo
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.atk-recovery.jsonc
          printf '%s' "$ATK_HEARTBEAT_PRIVATE_KEY_PEM" | npx wrangler secret put ATK_HEARTBEAT_PRIVATE_KEY_PEM --config wrangler.atk-recovery.jsonc
          printf '%s' "$FISKALO_ALLOWED_ORIGINS" | npx wrangler secret put FISKALO_ALLOWED_ORIGINS --config wrangler.atk-recovery.jsonc

      - name: Deploy Fiskalo web application Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: https://saavqlbwffrwxingbnri.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ATK_RECOVERY_WORKER_URL: ${{ secrets.NEXT_PUBLIC_ATK_RECOVERY_WORKER_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_ATK_RECOVERY_WORKER_URL" || (echo "Missing GitHub secret NEXT_PUBLIC_ATK_RECOVERY_WORKER_URL" && exit 1)
          npm run deploy

      - name: Deploy scheduled ATK recovery Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.atk-recovery.jsonc
